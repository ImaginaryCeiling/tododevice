; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

lib_deps = bodmer/TFT_eSPI @ ^2.5.43
build_flags =
  -D USER_SETUP_LOADED
  -D ST7789_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=16
  -D TFT_RST=17
  -D SPI_FREQUENCY=27000000
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_ON

  ; --- fonts (this is the key) ---
  -D LOAD_GLCD        ; built-in 8x font (font 1)
  -D LOAD_FONT2       ; small font
  -D LOAD_FONT4       ; medium font
  -D LOAD_FONT6       ; large digits
  -D LOAD_FONT7       ; 7-seg style
  -D LOAD_FONT8       ; large font
  -D SMOOTH_FONT      ; (optional) anti-aliased fonts
       ; try ON first; if colors look odd, switch to OFF
